services:
  whatsapp-service:
    build: ./whatsapp-service
    ports:
      - "3000:3000"
    volumes:
      - ./whatsapp-service/session:/app/session
    environment:
      - PORT=3000
      - SESSION_DIR=/app/session
    restart: unless-stopped

