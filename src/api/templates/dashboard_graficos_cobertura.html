<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobertura por Sucursal — Badie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        body { background-color: #111827; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #34d399; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-white">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-emerald-400">📊 Cobertura por Sucursal</h1>
            <span class="text-sm text-gray-400">Badie &amp; Cía</span>
        </div>
    </header>

    <!-- Filters -->
    <section class="max-w-7xl mx-auto px-6 py-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Genérico -->
            <div>
                <label for="generico" class="block text-sm font-medium text-gray-300 mb-1">Genérico</label>
                <select id="generico" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="">— Seleccionar —</option>
                    {% for g in genericos %}
                    <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>
            <!-- Zona -->
            <div>
                <label for="zona" class="block text-sm font-medium text-gray-300 mb-1">Zona</label>
                <select id="zona" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="">— Seleccionar —</option>
                </select>
            </div>
            <!-- Sucursal -->
            <div>
                <label for="sucursal" class="block text-sm font-medium text-gray-300 mb-1">Sucursal</label>
                <select id="sucursal" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" disabled>
                    <option value="">— Primero elegir zona —</option>
                </select>
            </div>
            <!-- Período -->
            <div class="flex gap-2 items-end">
                <div class="flex-1">
                    <label for="desde" class="block text-sm font-medium text-gray-300 mb-1">Desde</label>
                    <input type="date" id="desde" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="flex-1">
                    <label for="hasta" class="block text-sm font-medium text-gray-300 mb-1">Hasta</label>
                    <input type="date" id="hasta" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>
        </div>
        <div class="mt-4 flex items-center gap-3">
            <button id="btn-consultar" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-400 disabled:opacity-50" disabled>
                Consultar
            </button>
            <div id="spinner" class="hidden loader"></div>
            <span id="error-msg" class="text-red-400 text-sm hidden"></span>
        </div>
    </section>

    <!-- Charts -->
    <section id="charts-section" class="max-w-7xl mx-auto px-6 pb-10 hidden">
        <h2 id="chart-title" class="text-lg font-semibold text-gray-200 mb-4"></h2>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
            <!-- Cobertura combo bar+line -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
                <h3 class="text-sm font-medium text-gray-400 mb-3">Cobertura mensual</h3>
                <div class="relative" style="height: 380px;">
                    <canvas id="chartCobertura"></canvas>
                </div>
            </div>
            <!-- Comparación grouped bar -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
                <h3 class="text-sm font-medium text-gray-400 mb-3">Comparativo año vs año</h3>
                <div class="relative" style="height: 380px;">
                    <canvas id="chartComparacion"></canvas>
                </div>
            </div>
        </div>
    </section>

    <script>
    // ── Brand colors from backend constants ──────────────────────────
    const COLORES_MARCA = {{ colores_marca | tojson }};
    const FALLBACK_COLORS = {{ fallback_colors | tojson }};

    // ── State ──────────────────────────────────────────────────────────
    let zonasData = [];
    let chartCob = null;
    let chartComp = null;

    // ── DOM refs ───────────────────────────────────────────────────────
    const selGenerico  = document.getElementById('generico');
    const selZona      = document.getElementById('zona');
    const selSucursal  = document.getElementById('sucursal');
    const inputDesde   = document.getElementById('desde');
    const inputHasta   = document.getElementById('hasta');
    const btnConsultar = document.getElementById('btn-consultar');
    const spinner      = document.getElementById('spinner');
    const errorMsg     = document.getElementById('error-msg');
    const chartsSection = document.getElementById('charts-section');
    const chartTitle   = document.getElementById('chart-title');

    // ── Init ───────────────────────────────────────────────────────────
    (async function init() {
        // Default date range: current year-01-01 to today
        const today = new Date();
        const yyyy = today.getFullYear();
        inputDesde.value = `${yyyy}-01-01`;
        inputHasta.value = today.toISOString().split('T')[0];

        // Fetch zonas + sucursales
        try {
            const resp = await fetch('/graficos-cobertura/zonas');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            zonasData = data.zonas;

            selZona.innerHTML = '<option value="">— Seleccionar —</option>';
            zonasData.forEach(z => {
                const opt = document.createElement('option');
                opt.value = z.nombre;
                opt.textContent = z.nombre;
                opt.dataset.sucursales = JSON.stringify(z.sucursales);
                selZona.appendChild(opt);
            });
        } catch (err) {
            showError('Error cargando zonas: ' + err.message);
        }
    })();

    // ── Cascade: zona change → populate sucursales ────────────────────
    selZona.addEventListener('change', () => {
        const opt = selZona.selectedOptions[0];
        selSucursal.innerHTML = '<option value="">— Seleccionar —</option>';
        selSucursal.disabled = true;

        if (!opt || !opt.value) return;

        const sucs = JSON.parse(opt.dataset.sucursales || '[]');
        sucs.forEach(s => {
            const o = document.createElement('option');
            o.value = s.id;
            o.textContent = s.nombre;
            selSucursal.appendChild(o);
        });
        selSucursal.disabled = false;
        checkReady();
    });

    // ── Enable button when all params selected ─────────────────────────
    [selGenerico, selZona, selSucursal, inputDesde, inputHasta].forEach(el => {
        el.addEventListener('change', checkReady);
    });
    function checkReady() {
        const ready = selGenerico.value && selZona.value && selSucursal.value
                      && inputDesde.value && inputHasta.value;
        btnConsultar.disabled = !ready;
    }

    // ── Consultar ──────────────────────────────────────────────────────
    btnConsultar.addEventListener('click', async () => {
        hideError();
        spinner.classList.remove('hidden');
        btnConsultar.disabled = true;
        chartsSection.classList.add('hidden');

        try {
            const params = new URLSearchParams({
                zona: selZona.value,
                generico: selGenerico.value,
                id_sucursal: selSucursal.value,
                fecha_desde: inputDesde.value,
                fecha_hasta: inputHasta.value,
            });
            const resp = await fetch(`/graficos-cobertura/cobertura-sucursal?${params}`);
            if (!resp.ok) {
                const errBody = await resp.json().catch(() => ({}));
                throw new Error(errBody.detail || `HTTP ${resp.status}`);
            }
            const data = await resp.json();
            renderCharts(data);
        } catch (err) {
            showError('Error: ' + err.message);
        } finally {
            spinner.classList.add('hidden');
            btnConsultar.disabled = false;
        }
    });

    // ── Render charts ──────────────────────────────────────────────────
    function renderCharts(data) {
        const sucNombre = data.sucursal.nombre;
        const generico = data.generico;
        chartTitle.textContent = `${sucNombre} — ${generico}`;
        chartsSection.classList.remove('hidden');

        // Destroy previous instances
        if (chartCob)  chartCob.destroy();
        if (chartComp) chartComp.destroy();

        // Cobertura (bar + line combo)
        const cobConfig = data.chart_cobertura;
        cobConfig.options.plugins = cobConfig.options.plugins || {};
        cobConfig.options.plugins.legend = { labels: { color: '#d1d5db' } };
        cobConfig.options.scales = cobConfig.options.scales || {};
        cobConfig.options.scales.x = { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(75,85,99,0.3)' } };
        cobConfig.options.scales.y = { ...cobConfig.options.scales.y, ticks: { color: '#9ca3af' }, grid: { color: 'rgba(75,85,99,0.3)' } };

        chartCob = new Chart(document.getElementById('chartCobertura'), cobConfig);

        // Comparacion (grouped bar)
        const compConfig = data.chart_comparacion;
        compConfig.options.plugins = compConfig.options.plugins || {};
        compConfig.options.plugins.legend = { labels: { color: '#d1d5db' } };
        compConfig.options.scales = compConfig.options.scales || {};
        compConfig.options.scales.x = { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(75,85,99,0.3)' } };
        compConfig.options.scales.y = { ...compConfig.options.scales.y, ticks: { color: '#9ca3af' }, grid: { color: 'rgba(75,85,99,0.3)' } };

        chartComp = new Chart(document.getElementById('chartComparacion'), compConfig);
    }

    // ── Error helpers ──────────────────────────────────────────────────
    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
    }
    function hideError() {
        errorMsg.classList.add('hidden');
    }
    </script>
</body>
</html>
